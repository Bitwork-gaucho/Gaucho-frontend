<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080608"/>
      <stop offset="55%" stop-color="#0f0a06"/>
      <stop offset="100%" stop-color="#1e0d04"/>
    </linearGradient>

    <!-- Horizon ember glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#a03800" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#5c1e00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Ember bed glow -->
    <radialGradient id="emberBed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#c84000" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7a2000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0800" stop-opacity="0"/>
    </radialGradient>

    <!-- Meat highlight gradient -->
    <linearGradient id="meatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c06830"/>
      <stop offset="40%" stop-color="#8b3a10"/>
      <stop offset="100%" stop-color="#3d1500"/>
    </linearGradient>

    <!-- Sear marks gradient -->
    <linearGradient id="searGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0800"/>
      <stop offset="50%" stop-color="#0f0400"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </linearGradient>

    <!-- Fat/marbling highlight -->
    <linearGradient id="marblingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b080" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c07040" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Smoke gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3a2010" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a2010" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for embers -->
    <filter id="emberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for fire particles -->
    <filter id="fireGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle blur for smoke -->
    <filter id="smokeBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Meat edge glow -->
    <filter id="meatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="480" height="600" fill="url(#skyGrad)"/>

  <!-- Stars – scattered fine dots -->
  <g opacity="0.6">
    <circle cx="42"  cy="28"  r="0.8" fill="#f0ede8"/>
    <circle cx="115" cy="15"  r="0.6" fill="#f0ede8"/>
    <circle cx="200" cy="8"   r="1.0" fill="#f0ede8"/>
    <circle cx="310" cy="22"  r="0.7" fill="#f0ede8"/>
    <circle cx="390" cy="11"  r="0.9" fill="#f0ede8"/>
    <circle cx="450" cy="34"  r="0.6" fill="#f0ede8"/>
    <circle cx="70"  cy="60"  r="0.7" fill="#f0ede8"/>
    <circle cx="160" cy="45"  r="0.5" fill="#f0ede8"/>
    <circle cx="260" cy="38"  r="0.8" fill="#f0ede8"/>
    <circle cx="355" cy="55"  r="0.6" fill="#f0ede8"/>
    <circle cx="430" cy="70"  r="0.7" fill="#f0ede8"/>
    <circle cx="18"  cy="90"  r="0.5" fill="#f0ede8"/>
    <circle cx="95"  cy="110" r="0.6" fill="#f0ede8"/>
    <circle cx="195" cy="80"  r="0.4" fill="#f0ede8"/>
    <circle cx="320" cy="95"  r="0.7" fill="#f0ede8"/>
    <circle cx="465" cy="105" r="0.5" fill="#f0ede8"/>
    <circle cx="140" cy="130" r="0.4" fill="#f0ede8"/>
    <circle cx="385" cy="140" r="0.6" fill="#f0ede8"/>
    <circle cx="240" cy="120" r="0.5" fill="#f0ede8"/>
    <circle cx="50"  cy="150" r="0.4" fill="#f0ede8"/>
  </g>

  <!-- Milky way band (subtle) -->
  <ellipse cx="240" cy="100" rx="220" ry="40" fill="#2a1a0a" opacity="0.12" transform="rotate(-15 240 100)"/>

  <!-- ── HORIZON GLOW ── -->
  <rect x="0" y="200" width="480" height="400" fill="url(#horizonGlow)"/>

  <!-- ── PAMPAS SILHOUETTE ── -->
  <!-- Distant low hills -->
  <path d="M0 310 Q80 290 160 300 Q240 290 320 302 Q400 292 480 305 L480 340 L0 340 Z"
        fill="#0e0905" opacity="0.9"/>

  <!-- Pampas grass — left cluster -->
  <g fill="#1a1008" opacity="0.85">
    <path d="M-5 340 Q8 290 15 280 Q18 295 12 340 Z"/>
    <path d="M10 340 Q25 285 30 270 Q35 290 28 340 Z"/>
    <path d="M22 340 Q38 295 42 282 Q46 300 40 340 Z"/>
    <path d="M35 340 Q48 302 52 292 Q56 308 50 340 Z"/>
    <path d="M0 340 Q12 305 8 298 Q14 315 10 340 Z"/>
    <path d="M55 338 Q68 298 70 288 Q74 305 68 338 Z"/>
    <path d="M68 340 Q80 300 84 290 Q88 308 80 340 Z"/>
  </g>

  <!-- Pampas grass — right cluster -->
  <g fill="#1a1008" opacity="0.85">
    <path d="M390 340 Q402 292 408 280 Q412 298 404 340 Z"/>
    <path d="M404 340 Q418 288 424 275 Q428 295 420 340 Z"/>
    <path d="M420 340 Q432 295 438 284 Q442 302 434 340 Z"/>
    <path d="M435 338 Q448 300 452 290 Q456 308 448 338 Z"/>
    <path d="M450 340 Q462 305 465 295 Q470 312 462 340 Z"/>
    <path d="M462 340 Q474 298 478 288 Q482 305 476 340 Z"/>
    <path d="M382 338 Q394 304 396 295 Q400 312 392 338 Z"/>
  </g>

  <!-- Mid-ground grass tufts -->
  <g fill="#150d06" opacity="0.9">
    <path d="M100 342 Q110 312 115 304 Q120 318 112 342 Z"/>
    <path d="M118 342 Q126 315 130 306 Q134 320 126 342 Z"/>
    <path d="M340 342 Q350 310 355 302 Q360 316 352 342 Z"/>
    <path d="M358 342 Q366 318 370 308 Q374 322 366 342 Z"/>
    <path d="M200 340 Q208 316 212 308 Q216 320 208 340 Z"/>
    <path d="M215 340 Q224 314 228 304 Q232 320 224 340 Z"/>
    <path d="M270 341 Q278 318 281 310 Q285 322 278 341 Z"/>
  </g>

  <!-- ── SMOKE WISPS ── -->
  <g filter="url(#smokeBlur)" opacity="0.25">
    <path d="M190 360 Q195 330 188 300 Q185 280 192 260" stroke="#8a5a30" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M240 355 Q248 320 242 292 Q238 270 246 248" stroke="#7a4a28" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M290 358 Q296 328 290 300 Q286 278 294 258" stroke="#8a5a30" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M215 357 Q220 332 215 308 Q210 288 218 270" stroke="#6a4020" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M265 356 Q272 326 267 298 Q262 278 270 260" stroke="#6a4020" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ── EMBER BED GLOW ── -->
  <ellipse cx="240" cy="490" rx="180" ry="55" fill="url(#emberBed)" filter="url(#emberGlow)"/>

  <!-- ── GRILL STRUCTURE ── -->
  <!-- Grill body / kettle shadow -->
  <ellipse cx="240" cy="548" rx="155" ry="22" fill="#0a0604" opacity="0.95"/>
  <!-- Grill rim highlight -->
  <ellipse cx="240" cy="545" rx="152" ry="18" fill="none" stroke="#2a1806" stroke-width="2"/>

  <!-- Grill legs -->
  <line x1="160" y1="548" x2="148" y2="590" stroke="#1a1008" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="240" y1="552" x2="240" y2="592" stroke="#1a1008" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="320" y1="548" x2="332" y2="590" stroke="#1a1008" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Grill bowl interior (hot embers) -->
  <ellipse cx="240" cy="510" rx="148" ry="24" fill="#200f04"/>
  <!-- Ember surface -->
  <ellipse cx="240" cy="509" rx="140" ry="20" fill="#3a1400" opacity="0.9"/>

  <!-- Hot embers – glowing coals -->
  <g filter="url(#fireGlow)">
    <!-- Bright core embers -->
    <ellipse cx="200" cy="509" rx="18" ry="5" fill="#ff5500" opacity="0.8"/>
    <ellipse cx="250" cy="507" rx="22" ry="6" fill="#ff6600" opacity="0.85"/>
    <ellipse cx="290" cy="510" rx="15" ry="4" fill="#ff4800" opacity="0.75"/>
    <ellipse cx="165" cy="511" rx="12" ry="3.5" fill="#e04000" opacity="0.7"/>
    <ellipse cx="315" cy="508" rx="14" ry="4" fill="#ff5200" opacity="0.72"/>
    <ellipse cx="228" cy="512" rx="10" ry="3" fill="#cc3800" opacity="0.65"/>
    <ellipse cx="272" cy="506" rx="12" ry="3.5" fill="#ff5800" opacity="0.78"/>
    <!-- Dim ember patches -->
    <ellipse cx="185" cy="513" rx="8"  ry="2.5" fill="#883000" opacity="0.6"/>
    <ellipse cx="310" cy="512" rx="9"  ry="2.5" fill="#773000" opacity="0.55"/>
    <ellipse cx="240" cy="514" rx="16" ry="3"   fill="#aa3800" opacity="0.5"/>
  </g>

  <!-- ── GRILL GRATE ── -->
  <g opacity="0.7">
    <!-- Longitudinal bars -->
    <line x1="102" y1="478" x2="378" y2="478" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="98"  y1="488" x2="382" y2="488" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="97"  y1="498" x2="383" y2="498" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="98"  y1="508" x2="382" y2="508" stroke="#2a1a0a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cross bars -->
    <line x1="130" y1="475" x2="120" y2="512" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="175" y1="474" x2="168" y2="511" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="220" y1="474" x2="215" y2="511" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="265" y1="474" x2="262" y2="511" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="310" y1="474" x2="310" y2="511" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="355" y1="475" x2="358" y2="512" stroke="#2a1a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Grate highlight edge (top bar with ember glow) -->
  <line x1="100" y1="478" x2="380" y2="478" stroke="#8b3a00" stroke-width="1" opacity="0.4"/>

  <!-- ── RIBEYE STEAK ── -->
  <!-- Main steak body -->
  <path d="M148 470 Q158 448 190 442 Q215 436 250 438 Q285 436 310 444 Q334 450 340 462 Q346 474 338 484 Q325 495 295 498 Q265 502 238 501 Q210 502 185 496 Q162 490 150 480 Z"
        fill="url(#meatGrad)" filter="url(#meatGlow)"/>

  <!-- Sear marks (charred grill lines on meat) -->
  <g opacity="0.85">
    <path d="M165 468 Q180 450 195 444" stroke="#1a0800" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M195 472 Q210 453 226 447" stroke="#1a0800" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M224 475 Q240 455 257 449" stroke="#1a0800" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M255 477 Q270 457 287 451" stroke="#1a0800" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M285 476 Q300 458 316 452" stroke="#1a0800" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Sear mark bright edges (hot crust glow) -->
  <g opacity="0.3">
    <path d="M165 468 Q180 450 195 444" stroke="#c85000" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M224 475 Q240 455 257 449" stroke="#c85000" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M285 476 Q300 458 316 452" stroke="#c85000" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Fat cap on top edge of steak -->
  <path d="M190 442 Q215 436 250 438 Q285 436 310 444 Q295 440 270 438 Q245 436 222 438 Q206 439 190 442 Z"
        fill="#d49060" opacity="0.7"/>

  <!-- Marbling veins -->
  <g opacity="0.35" fill="none" stroke="#e0a070" stroke-width="1.5" stroke-linecap="round">
    <path d="M200 460 Q215 456 228 462 Q238 466 248 460"/>
    <path d="M255 465 Q268 460 280 466"/>
    <path d="M175 472 Q188 467 198 474"/>
    <path d="M305 468 Q316 464 325 470"/>
    <path d="M220 480 Q235 475 248 481 Q258 486 270 480"/>
  </g>

  <!-- Steak surface sheen (highlight across top) -->
  <path d="M165 458 Q210 445 260 445 Q300 445 330 455 Q300 448 258 448 Q215 448 165 458 Z"
        fill="#ff9060" opacity="0.2"/>

  <!-- Meat edge drip (juices running off) -->
  <path d="M185 496 Q182 502 184 506" stroke="#8b3010" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M225 501 Q224 507 226 512" stroke="#8b3010" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- ── FIRE PARTICLES ── -->
  <g filter="url(#fireGlow)">
    <!-- Main flame tongues -->
    <path d="M185 508 Q182 498 186 490 Q190 480 185 472 Q188 482 192 490 Q196 498 192 508 Z"
          fill="#ff6a00" opacity="0.6"/>
    <path d="M250 507 Q246 494 251 484 Q255 472 250 462 Q254 474 258 484 Q263 494 258 507 Z"
          fill="#ff7800" opacity="0.65"/>
    <path d="M310 508 Q306 498 310 488 Q314 478 310 470 Q314 480 318 490 Q322 500 316 508 Z"
          fill="#ff6200" opacity="0.55"/>
    <!-- Small flicker flames -->
    <path d="M160 511 Q158 504 161 498 Q164 492 160 487 Q163 494 166 500 Q168 506 164 511 Z"
          fill="#ff5500" opacity="0.45"/>
    <path d="M220 509 Q218 503 221 497 Q224 490 221 485 Q224 492 227 498 Q229 504 225 509 Z"
          fill="#ff6800" opacity="0.5"/>
    <path d="M280 508 Q278 501 281 495 Q284 488 280 483 Q283 490 286 496 Q289 502 285 508 Z"
          fill="#ff5800" opacity="0.48"/>
    <path d="M335 509 Q333 502 336 496 Q339 490 335 485 Q338 492 341 498 Q343 504 339 509 Z"
          fill="#ff5200" opacity="0.42"/>
    <!-- Ember sparks -->
    <circle cx="175" cy="468" r="1.5" fill="#ffaa00" opacity="0.9"/>
    <circle cx="240" cy="460" r="2"   fill="#ff8800" opacity="0.85"/>
    <circle cx="300" cy="466" r="1.5" fill="#ffaa00" opacity="0.8"/>
    <circle cx="210" cy="455" r="1.2" fill="#ff9900" opacity="0.75"/>
    <circle cx="268" cy="458" r="1.8" fill="#ffbb00" opacity="0.9"/>
    <circle cx="325" cy="462" r="1.3" fill="#ff8800" opacity="0.7"/>
    <circle cx="155" cy="475" r="1.0" fill="#ff7700" opacity="0.6"/>
    <circle cx="356" cy="472" r="1.2" fill="#ff9900" opacity="0.65"/>
  </g>

  <!-- ── AMBIENT GROUND GLOW ── -->
  <ellipse cx="240" cy="540" rx="200" ry="30" fill="#aa3800" opacity="0.12" filter="url(#smokeBlur)"/>

  <!-- ── VIGNETTE ── -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>
  <rect width="480" height="600" fill="url(#vignette)"/>

  <!-- Bottom fade to blend with page -->
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="480" width="480" height="120" fill="url(#bottomFade)"/>
</svg>
